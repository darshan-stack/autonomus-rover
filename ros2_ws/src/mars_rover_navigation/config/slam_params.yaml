slam_toolbox:
  ros__parameters:
    use_sim_time: true

    # Frames
    map_frame: map
    odom_frame: odom
    base_frame: base_link

    # Your sim publishes LaserScan on /lidar (not /scan)
    scan_topic: /lidar

    # Reasonable defaults for online async mapping
    mode: mapping
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 2.0
    resolution: 0.05
    max_laser_range: 30.0

